services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: GymTracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: juju2001
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GymTracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrition-network

  app:
    image: vitor4442/nutrition:latest
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GymTracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: juju2001
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - nutrition-network

volumes:
  postgres_data:

networks:
  nutrition-network:
    driver: bridge
