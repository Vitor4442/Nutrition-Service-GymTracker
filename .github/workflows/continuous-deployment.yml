name: Continuos Integration And Delivery with Github Actions

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN}}

      - name: Setup Java 21
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
          cache: maven

      - name: Build Application .jar
        working-directory: ./
        run: mvn clean package


      - name: Docker Compose Build
        working-directory: ./
        run: docker compose  build

      - name: Push to Docker Hub Container Registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/nutrition:latest ${{ secrets.DOCKER_USERNAME }}/nutrition:${{github.run_id}}
          
          docker push ${{ secrets.DOCKER_USERNAME }}/nutrition:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nutrition:${{github.run_id}}
        
